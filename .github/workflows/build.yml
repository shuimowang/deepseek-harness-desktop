name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\DshDesktop.csproj
      - name: Build
        run: dotnet build .\DshDesktop.csproj -c Release --no-restore
      - name: Validate locked DSH runtime
        run: npm ci --prefix .\runtime\dsh-package --omit=dev --ignore-scripts --no-audit --no-fund --dry-run
      - name: Audit NuGet packages
        run: dotnet list .\DshDesktop.csproj package --vulnerable --include-transitive
